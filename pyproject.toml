[project]
name = "f1-stats"
version = "0.2.0"
description = "2026 Formula 1 season statistics — weekly auto-generated standings, race results, and analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1stats"]

[project.scripts]
f1stats = "f1stats.cli:main"
