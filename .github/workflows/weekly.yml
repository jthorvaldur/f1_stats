name: Weekly F1 Stats Regeneration

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  pages: write

concurrency:
  group: weekly-f1-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run regression tests
        run: bash scripts/test.sh

      - name: Regenerate pages
        run: uv run --locked f1stats generate

      - name: Validate generated pages
        run: uv run --locked python scripts/check_pages.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: weekly F1 stats regeneration ($(date -u +%F))"
            git push
          fi

      # GITHUB_TOKEN pushes do not trigger Pages builds. Request one explicitly,
      # including on no-change runs so a previous failed build can be retried.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
